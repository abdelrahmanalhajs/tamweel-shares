services:
  - type: web
    name: tamweel-shares
    runtime: docker
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /data/tamweel.db
      # Create the first admin account on boot (set both in the Render dashboard; password >= 10 chars)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional: enables AI document reading + investor assistant (documents/questions are sent to Anthropic's API)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Demo top-up button. Remove this line once a real payment provider is connected.
      - key: ALLOW_DEMO_DEPOSIT
        value: "1"
    disk:
      name: tamweel-data
      mountPath: /data
      sizeGB: 1

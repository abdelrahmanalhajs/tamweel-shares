<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تمويل شيرز | Tamweel Shares</title>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--ink:#0f172a;--mut:#64748b;--bg:#f6f8f9;--card:#fff;--line:#e2e8f0;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--g);text-decoration:none}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.25rem;color:var(--g);margin-inline-end:auto}
.logo span{color:var(--ink)}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
.btn{display:inline-block;border:0;background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:hover{background:#0b5f58}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:36px 24px;margin-bottom:24px}
.hero h1{margin:0 0 8px;font-size:2rem}
.hero p{margin:0 0 18px;opacity:.95;max-width:560px}
.hero .btn{background:#fff;color:var(--g)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step b{display:block;color:var(--g)}
h2{margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:4px 0 6px}
.tag{display:inline-block;background:#ccfbf1;color:var(--g);font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px}
.mut{color:var(--mut);font-size:.9rem}
.prog{height:9px;background:#e6ecef;border-radius:9px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2))}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat small{color:var(--mut);display:block}
.stat b{font-size:1.5rem}
.wallet{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border:0}
.wallet .big{font-size:2.2rem;font-weight:800}
.wallet .mut{color:#cbd5e1}
form.f{display:grid;gap:12px;max-width:420px}
label{font-size:.85rem;font-weight:600;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:.8rem}
.tw{overflow-x:auto}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#065f46}
.msg.err{background:#fef2f2;color:#991b1b}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.two.eq{grid-template-columns:1fr 1fr}
@media(max-width:760px){.two,.two.eq{grid-template-columns:1fr}.hero h1{font-size:1.6rem}}
.seg{display:flex;gap:8px}
.seg label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:600}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--g);background:#ccfbf1;color:var(--g)}
.pos{color:#047857;font-weight:700}
.neg{color:#b91c1c;font-weight:700}
.risk{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;margin-inline-start:6px}
.risk-low{background:#dcfce7;color:#166534}.risk-medium{background:#fef3c7;color:#92400e}.risk-high{background:#fee2e2;color:#991b1b}.risk-unrated{background:#e2e8f0;color:#475569}
.st-pending{background:#fef3c7;color:#92400e}.st-approved{background:#dcfce7;color:#166534}.st-rejected{background:#fee2e2;color:#991b1b}.st-paid{background:#dcfce7;color:#166534}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs a{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.88rem;color:var(--ink)}
.tabs a.on{background:var(--g);color:#fff;border-color:var(--g)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:0 0 16px}
@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;font-size:.85rem;margin:12px 0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0}dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;font-weight:600}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:start}
</style>
</head>

async function sSha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* TOTP (RFC 6238) with WebCrypto, so real authenticator apps work */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const b32enc=a=>{let bits='',o='';a.forEach(b=>bits+=b.toString(2).padStart(8,'0'));for(let i=0;i<bits.length;i+=5)o+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return o};
const b32dec=s=>{let bits='';for(const c of s)bits+=B32.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o)};
async function totpAt(secret,counter){const k=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);const b=new ArrayBuffer(8);new DataView(b).setBigUint64(0,BigInt(counter));
  const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,b)),o=h[19]&15;return String(((h[o]&0x7f)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6).padStart(6,'0')}
async function totpValid(secret,code){const c=Math.floor(Date.now()/30000);for(const d of[-1,0,1])if(await totpAt(secret,c+d)===String(code))return true;return false}

/* ---------- API ---------- */
async function api(method,url,body){
  if(STATIC)return staticApi(method,url,body);
  let r;
  try{r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}
  catch(e){const x=new Error('server');x.code='server';throw x}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const x=new Error(d.error||'server');x.code=d.error||'server';throw x}
  return d;
}

function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
function kycCard(){
  if(!me||me.kyc===undefined||me.kyc==='approved')return '';
  if(me.kyc==='pending')return `<div class="msg">${t('kycPending')}</div>`;
  return `<div class="card" style="margin:12px 0"><b>${t('kycH')}</b>${me.kyc==='rejected'?`<div class="msg err">${t('kycRejected')} ${esc(me.kycNote||'')}</div>`:''}

async function doKyc(e){
  e.preventDefault();const f=e.target,file=f.file.files[0];

    if(file.size>2*1024*1024)throw {code:'file_too_large'};
    await api('POST','/api/documents',{kind:'kyc_id',filename:file.name,data:await readB64(file)});
    await api('POST','/api/kyc',{fullName:f.fn.value,nationalId:f.nid.value,phone:f.ph.value});

let CFG={ai:false};
const FLAGSEV={thin_data:1,mostly_unverified:1,loss_months:2,sales_decline:2,expense_spike:2,expenses_exceed_sales:3,declared_sales_mismatch:3,declared_profit_mismatch:3,high_debt:2,debt_growing:2,negative_cash:3,identical_revenue:3,round_numbers:2,identical_expenses:2,no_data:1};
function flagText(f){
  const m=x=>money(x);
  switch(f.code){
    case 'thin_data':return t('f_thin_data',num(f.months));case 'loss_months':return t('f_loss_months',num(f.count));
    case 'expense_spike':return t('f_expense_spike',f.months.join(', '));
    case 'declared_sales_mismatch':case 'declared_profit_mismatch':return t('f_'+f.code,m(f.declared),m(f.actual));
    case 'high_debt':return t('f_high_debt',num(f.ratio.toFixed(0)));case 'mostly_unverified':return t('f_mostly_unverified',num(f.share.toFixed(0)));
    default:return t('f_'+f.code);
  }
}
const flagList=fl=>fl.length?`<ul style="margin:6px 0;padding-inline-start:20px">${fl.map(f=>`<li style="color:${(FLAGSEV[f.code]||1)>=3?'#b91c1c':(FLAGSEV[f.code]||1)===2?'#b45309':'#64748b'}">${esc(flagText(f))}</li>`).join('')}</ul>`:`<p class="mut">${t('noFlags')}</p>`;
function compVal(c){const v=c.v||{},p=x=>num((+x||0).toFixed(1));
  switch(c.key){case 'stability':return t('rv_stability',num(v.months),p(v.volatility));case 'profitability':return t('rv_profitability',p(v.margin));case 'growth':return t('rv_growth',p(v.growth));
    case 'cashflow':return t('rv_cashflow',money(v.avgCash));case 'debt':return t('rv_debt',v.ratio==null?'—':p(v.ratio));case 'verification':return t('rv_verification',p(v.share),num(v.docs));
    default:return t('rv_history',v.age==null?'—':num(v.age))}
}
function chartSvg(series){
  if(!series.length)return '';const W=600,H=170,pad=24,max=Math.max(...series.map(r=>Math.max(r.revenue,r.expenses)),1),bw=(W-pad*2)/series.length;
  const bars=series.map((r,i)=>{const x=pad+i*bw,h1=(r.revenue/max)*(H-40),h2=(r.expenses/max)*(H-40);
    return `<rect x="${x+bw*.12}" y="${H-20-h1}" width="${bw*.36}" height="${h1}" fill="#0f766e" rx="2"/><rect x="${x+bw*.52}" y="${H-20-h2}" width="${bw*.36}" height="${h2}" fill="#f59e0b" rx="2"/>
    ${series.length<=12||i%2===0?`<text x="${x+bw/2}" y="${H-5}" font-size="9" text-anchor="middle" fill="#64748b">${r.month.slice(2)}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;direction:ltr">${bars}</svg><div class="mut" style="font-size:.8rem"><span style="color:#0f766e">■</span> ${t('revenue')} &nbsp; <span style="color:#f59e0b">■</span> ${t('expenses')}</div>`;
}

  const rate=r?`<div class="row" style="align-items:center;gap:14px"><div style="font-size:2.6rem;font-weight:800;color:var(--g);line-height:1">${r.grade}</div>

    <div style="margin-top:10px">${r.components.map(c=>`<div style="margin:6px 0"><div class="row" style="font-size:.88rem"><span>${t('rc_'+c.key)}</span><b>${num(c.score)}/${c.max}</b></div>
    <div class="prog" style="margin:2px 0;height:6px"><i style="width:${c.score/c.max*100}%"></i></div><div class="mut" style="font-size:.78rem">${esc(compVal(c))}</div></div>`).join('')}</div>`:`<p class="mut">${t('f_thin_data',num(a.n))}</p>`;
  const val=a.valuation?`<h3>${t('valH')}</h3><p><b>${money(a.valuation.low)} – ${money(a.valuation.high)}</b></p><p class="mut" style="font-size:.8rem">${t('valNote')}</p>`:'';
  return `<div class="card" style="margin-top:16px"><div class="row"><h3 style="margin-top:0">${t('anaH')}</h3><button class="btn ghost sm" onclick="window.print()">${t('print')}</button></div>

  <div class="stats">${kv('mAvgRev',money(m.avgRevenue))}${kv('mAvgExp',money(m.avgExpenses))}${kv('mAvgProfit',money(m.avgProfit))}${kv('mMargin',pc(m.netMargin))}
   ${kv('mGross',pc(m.grossMargin))}${kv('mBreak',m.breakEven==null?'—':money(m.breakEven))}${kv('mSafety',pc(m.marginOfSafety))}${kv('mGrowth',pc(m.growthPerMonth))}${kv('mCash',money(m.avgCash))}${kv('mLiab',money(m.liabilities))}</div>
  <h3>${t('flagsH')}</h3>${flagList(a.flags)}${val}
  ${full?`<details><summary class="mut" style="cursor:pointer">${t('finTable')}</summary><div class="tw"><table><tr><th>${t('month')}</th><th>${t('revenue')}</th><th>${t('expenses')}</th><th>${t('profit')}</th><th>${t('verifiedCol')}</th></tr>
  ${a.series.map(r=>`<tr><td dir="ltr">${r.month}</td><td>${money(r.revenue)}</td><td>${money(r.expenses)}</td><td class="${r.profit>=0?'pos':'neg'}">${money(r.profit)}</td><td>${r.verified?'✓':''}</td></tr>`).join('')}</table></div></details>`:''}

function portfolioHtml(d){
  const hs=d.holdings.filter(h=>h.category);if(!hs.length)return '';
  const tot=hs.reduce((a,h)=>a+h.invested,0)||1;const by=(k)=>{const m={};hs.forEach(h=>m[h[k]||'unrated']=(m[h[k]||'unrated']||0)+h.invested);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=(l,label)=>l.map(([k,v])=>`<div style="margin:6px 0"><div class="row" style="font-size:.88rem"><span>${label(k)}</span><b>${num((v/tot*100).toFixed(0))}%</b></div><div class="prog" style="margin:2px 0;height:6px"><i style="width:${v/tot*100}%"></i></div></div>`).join('');
  const hhi=hs.reduce((a,h)=>a+(h.invested/tot)**2,0),lvl=hhi>0.5?'high':hhi>0.3?'mid':'low';
  return `<h2>${t('portH')}</h2><div class="card"><div class="two eq"><div><b>${t('bySector')}</b>${bars(by('category'),k=>catName(k))}</div><div><b>${t('byRisk')}</b>${bars(by('risk'),k=>t('r_'+k))}</div></div>
   <p style="margin-bottom:0"><b>${t('concH')}:</b> ${t('conc_'+lvl)} <span class="mut">(HHI ${num(hhi.toFixed(2))})</span></p></div>`;
}

/* ----- admin extra tabs (simulation) ----- */
async function adminSim(tab){
  if(tab==='risk'){
    const l=await api('GET','/api/admin/risk');
    return l.map(r=>`<div class="card" style="margin-bottom:10px"><div class="row"><h3 style="margin:0"><a href="#/project/${r.id}">${esc(r.title)}</a> ${r.rating?`<span class="tag">${r.rating.grade} · ${num(r.rating.score)}</span>`:''}</h3>
      <span>${t('riskSev')}: <b style="color:${r.severity>8?'#b91c1c':r.severity>3?'#b45309':'#16a34a'}">${num(r.severity)}</b></span></div>
      ${flagList(r.flags)}<p class="mut" style="margin:4px 0">${r.missingReport?'⚠️ '+t('missRep')+' · ':''}${r.delayedMilestones?'⚠️ '+t('delMs')+': '+num(r.delayedMilestones)+' · ':''}${r.fundFlags.map(x=>x.code==='overspend'?t('ff_overspend',fundCat(x.category)):t('ff_unplanned_spend')).join(' · ')}</p>
      <form class="f" style="max-width:none;grid-template-columns:1fr auto" onsubmit="return sendAlert(event,${r.id})"><input name="m" required maxlength="300" placeholder="${t('alertMsg')}"><button class="btn ghost sm">${t('sendAlert')}</button></form></div>`).join('')||`<div class="card mut">${t('nothing')}</div>`;
  }
  if(tab==='revenue'){
    const r=await api('GET','/api/admin/revenue');
    return `<div class="stats"><div class="stat"><small>${t('revH')}</small><b>${money(r.total)}</b></div>${Object.entries(r.byKind).map(([k,v])=>`<div class="stat"><small>${t('rk_'+k)}</small><b>${money(v)}</b></div>`).join('')}</div>
     <p class="mut">${t('revRates',num(r.rates.study),num(r.rates.success),num(r.rates.mgmt))}</p>
     <div class="card" style="margin-bottom:12px"><form class="f" style="max-width:none;grid-template-columns:1fr 1fr 2fr auto;align-items:end" onsubmit="return addRevenue(event)"><label>${t('type')}<select name="k">${['subscription','service','study','success','mgmt','expense'].map(k=>`<option value="${k}">${t('rk_'+k)}</option>`).join('')}</select></label>
      <label>${t('amount')} ($)<input name="a" type="number" min="0.01" step="0.01" required></label><label>${t('note')}<input name="n" maxlength="150"></label><button class="btn sm">${t('addRev')}</button></form></div>
     <div class="card tw"><table><tr><th>${t('date')}</th><th>${t('type')}</th><th>${t('project')}</th><th>${t('note')}</th><th>${t('amount')}</th></tr>${r.items.map(i=>`<tr><td>${fdate(i.created)}</td><td>${t('rk_'+i.kind)}</td><td>${esc(i.project||'')}</td><td>${esc(i.note)}</td><td class="${i.amount>=0?'pos':'neg'}">${money(i.amount)}</td></tr>`).join('')}</table></div>`;
  }
  if(tab==='escrow'){
    const l=await api('GET','/api/admin/escrow');
    return `<div class="warn">${t('escrowNote')}</div><div class="card tw"><table><tr><th>${t('project')}</th><th>${t('raised')}</th><th>${t('goal')}</th><th>${t('status')}</th><th></th></tr>${l.map(e=>`<tr><td>${esc(e.title)}</td><td>${money(e.raised)}</td><td>${money(e.goal)}</td><td>${e.released?t('released2'):e.funded?t('funded2'):t('notFunded')}</td>
      <td>${!e.released?`<button class="btn sm" ${e.funded?'':'disabled'} onclick="releaseEscrow(${e.id})">${t('releaseEsc')}</button>`:''}</td></tr>`).join('')}</table></div>`;
  }
  if(tab==='announce'){
    return `<div class="card"><form class="f" style="max-width:none" onsubmit="return addAnnounce(event)"><label>${t('topicTitle')}<input name="t" required maxlength="150"></label><label>${t('body')}<textarea name="b" rows="3" required maxlength="2000"></textarea></label><div><button class="btn">${t('annH')}</button></div></form></div>`;
  }
  if(tab==='tools'){
    const [o,risk]=await Promise.all([api('GET','/api/admin/overview'),api('GET','/api/admin/risk')]);
    const good=risk.filter(r=>r.rating&&['A','B'].includes(r.rating.grade)).length,bad=risk.filter(r=>(r.rating&&r.rating.grade==='D')||r.severity>8).length;
    return `<div class="stats"><div class="stat"><small>${t('succProj')}</small><b class="pos">${num(good)}</b></div><div class="stat"><small>${t('strugProj')}</small><b class="neg">${num(bad)}</b></div><div class="stat"><small>${t('o_raised')}</small><b>${money(o.totalRaised)}</b></div><div class="stat"><small>${t('o_avg')}</small><b>${money(o.avgInvestment)}</b></div></div>
     <p><button class="btn" onclick="exportTx()">${t('exportTx')}</button> <button class="btn ghost" onclick="backupDemo()">${t('backup')}</button></p><p class="mut" style="font-size:.85rem">${t('backupNote')}</p>`;
  }
  return '';
}
async function sendAlert(e,id){e.preventDefault();try{await api('POST',`/api/admin/risk/${id}/alert`,{message:e.target.m.value});msg(t('alertSent'))}catch(x){msg(errText(x),1)}render();return false}
async function editOpp(e,id){e.preventDefault();const f=e.target;try{await api('POST',`/api/admin/projects/${id}/edit`,{title:f.ti.value,minShares:+f.mi.value,closed:f.cl.checked});msg(t('saved'))}catch(x){msg(errText(x),1)}render();return false}
async function addRevenue(e){e.preventDefault();const f=e.target;try{await api('POST','/api/admin/revenue',{kind:f.k.value,amount:+f.a.value,note:f.n.value||undefined});msg(t('saved'))}catch(x){msg(errText(x),1)}render();return false}
async function releaseEscrow(id){try{await api('POST',`/api/admin/escrow/${id}/release`,{});msg(t('saved'))}catch(x){msg(errText(x),1)}render()}
async function addAnnounce(e){e.preventDefault();try{await api('POST','/api/announcements',{title:e.target.t.value,body:e.target.b.value});msg(t('saved'))}catch(x){msg(errText(x),1)}render();return false}
async function exportTx(){const l=await api('GET','/api/admin/transactions');const csv=['date,user,type,project,amount',...l.map(x=>[new Date(x.date).toISOString(),x.user,x.type,x.project||'',x.amount].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='transactions.csv';a.click()}
function backupDemo(){const c=JSON.parse(JSON.stringify(S));c.users.forEach(u=>{delete u.pass;delete u.totpSecret});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,1)],{type:'application/json'}));a.download='tamweel-demo-backup.json';a.click()}

  return `<h1>${t('adminH')}</h1>${flash}<div class="tabs">${tabs.map(([k,l])=>`<a href="#/dashboard" class="${adminTab===k?'on':''}" onclick="setTab('${k}');return false">${t(l)}</a>`).join('')}</div>${body}`;
}
async function decideKyc(e,id){
  e.preventDefault();const f=e.target;
  try{await api('POST','/api/admin/kyc/'+id,{decision:f.dec,note:f.note.value||undefined});msg(t('saved'))}catch(x){msg(errText(x),1)}
  render();return false;
}
async function decideProject(e,id){
  e.preventDefault();const f=e.target;
  try{await api('POST',`/api/admin/projects/${id}/review`,{decision:f.dec.value,risk:f.risk.value,verificationNote:f.vn.value||undefined,adminNote:f.an.value||undefined});msg(t('saved'))}
  catch(x){msg(errText(x),1)}
  render();return false;
}
async function verifyAll(id,v,months){try{await api('POST',`/api/admin/projects/${id}/financials/verify`,{months:months.split(','),verified:v});msg(t('saved'))}catch(x){msg(errText(x),1)}render()}
async function decideExit(id,d){try{await api('POST','/api/admin/exits/'+id,{decision:d});msg(t('saved'))}catch(x){msg(errText(x),1)}render()}
async function resolveComplaint(e,id){e.preventDefault();try{await api('POST','/api/admin/complaints/'+id,{reply:e.target.r.value});msg(t('saved'))}catch(x){msg(errText(x),1)}render();return false}
async function decideWd(id,d){
  try{await api('POST','/api/admin/withdrawals/'+id,{decision:d});msg(t('saved'))}catch(x){msg(errText(x),1)}
  render();
}

/* ---------- router ---------- */
let renderTok=0;
async function render(){
  const tok=++renderTok;await loadUnread();nav();const h=location.hash||'#/';let html;
  try{
    if(h.startsWith('#/project/'))html=await vProject(parseInt(h.split('/')[2])||0);
    else if(h==='#/login')html=me?(go('#/dashboard'),''):vAuth('login');
    else if(h==='#/signup')html=me?(go('#/dashboard'),''):vAuth('signup');
    else if(h==='#/dashboard')html=!me?(go('#/login'),''):me.role==='admin'?await vAdmin():me.role==='owner'?await vOwner():await vInvestor();
    else if(h.startsWith('#/manage/'))html=me&&me.role==='owner'?await vManage(parseInt(h.split('/')[2])||0):(go('#/login'),'');
    else if(h.startsWith('#/contract/'))html=me?await vContract(parseInt(h.split('/')[2])||0):(go('#/login'),'');
    else if(h==='#/statements')html=me&&me.role==='investor'?await vStatements():(go('#/login'),'');
    else if(h==='#/community')html=await vCommunity();
    else if(h==='#/features')html=vFeatures();
    else if(h==='#/simulator')html=vSim();
    else if(h==='#/compare')html=await vCompare();
    else if(h==='#/market')html=await vMarket();
    else if(h==='#/account')html=me?await vAccount():(go('#/login'),'');
    else if(h==='#/notifications')html=me?await vNotifs():(go('#/login'),'');
    else if(h==='#/academy')html=vAcademy();
    else if(h==='#/new')html=me&&me.role==='owner'?vNew():(go('#/login'),'');
    else html=await vHome();
  }catch(e){html=`<div class="msg err">${esc(errText(e))}</div>`}
  if(tok!==renderTok)return;
  $('#app').innerHTML=html;flash='';if(window._post){const f=window._post;window._post=null;f()}
  if(!h.startsWith('#/new'))window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
async function boot(){
  try{const r=await fetch('/api/me',{credentials:'same-origin'});STATIC=!(r.ok&&/json/.test(r.headers.get('content-type')||''))}catch(e){STATIC=true}
  if(STATIC)document.querySelector('header').insertAdjacentHTML('afterend',`<div class="msg" style="margin:0;border-radius:0;text-align:center;font-size:.85rem;background:#fffbeb;color:#92400e">${t('staticNote')}</div>`);
  if(!STATIC){try{CFG=await api('GET','/api/config')}catch(e){}}
  await loadMe();render();
}
applyLang();boot();
</script>

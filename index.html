<meta charset="utf-8">

<title>تمويل شيرز | Tamweel Shares</title>
<style>
:root{--g:#0f766e;--g2:#14b8a6;--ink:#0f172a;--mut:#64748b;--bg:#f6f8f9;--card:#fff;--line:#e2e8f0;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--g);text-decoration:none}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.25rem;color:var(--g);margin-inline-end:auto}
.logo span{color:var(--ink)}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
.btn{display:inline-block;border:0;background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
.btn:hover{background:#0b5f58}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:36px 24px;margin-bottom:24px}
.hero h1{margin:0 0 8px;font-size:2rem}
.hero p{margin:0 0 18px;opacity:.95;max-width:560px}
.hero .btn{background:#fff;color:var(--g)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step b{display:block;color:var(--g)}
h2{margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:4px 0 6px}
.tag{display:inline-block;background:#ccfbf1;color:var(--g);font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px}
.mut{color:var(--mut);font-size:.9rem}
.prog{height:9px;background:#e6ecef;border-radius:9px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2))}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat small{color:var(--mut);display:block}
.stat b{font-size:1.5rem}
.wallet{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border:0}
.wallet .big{font-size:2.2rem;font-weight:800}
.wallet .mut{color:#cbd5e1}
form.f{display:grid;gap:12px;max-width:420px}
label{font-size:.85rem;font-weight:600;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:.8rem}
.tw{overflow-x:auto}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0;background:#ecfdf5;color:#065f46}
.msg.err{background:#fef2f2;color:#991b1b}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.two.eq{grid-template-columns:1fr 1fr}
@media(max-width:760px){.two,.two.eq{grid-template-columns:1fr}.hero h1{font-size:1.6rem}}
.seg{display:flex;gap:8px}
.seg label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-weight:600}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--g);background:#ccfbf1;color:var(--g)}
.pos{color:#047857;font-weight:700}
.neg{color:#b91c1c;font-weight:700}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:start}
</style>

};
function t(k,...a){let s=(T[k]||{})[lang]||k;a.forEach((v,i)=>s=s.replace('%'+(i+1),v));return s}
const CATS=['agri','food','energy','real','tech','retail','other'];
function setLang(l){lang=l;try{localStorage.setItem('tw_lang',l)}catch(e){}applyLang();render()}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}

/* ---------- static (no-server) mode ----------
   On a static host such as GitHub Pages there is no /api, so the very same API is
   emulated on top of localStorage. This is a DEMO: data lives only in this browser. */
let STATIC=false,S=null;
const MK='tw_static_v3';
const sErr=c=>{const e=new Error(c);e.code=c;return e};
const sSave=()=>{try{localStorage.setItem(MK,JSON.stringify(S))}catch(e){}};
const sId=()=>++S.n;
const sBal=u=>S.tx.filter(x=>x.uid===u).reduce((a,x)=>a+x.amount,0);
const sCts=(v,min,max)=>{const n=Number(v);if(!Number.isFinite(n)||n<min||n>max)throw sErr('bad_input');return Math.round(n*100)};
const sSold=p=>S.inv.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.shares,0);
const sTxAdd=(uid,type,amount,pid,note)=>S.tx.push({id:sId(),uid,type,amount,pid:pid||null,note:note||null,created:Date.now()});
function sProj(p){const u=S.users.find(x=>x.id===p.oid),s=sSold(p);
  return{id:p.id,title:p.title,category:p.category,description:p.description,owner:u?u.name:'',sharePrice:p.price/100,totalShares:p.total,sold:s,goal:p.price*p.total/100,raised:p.price*s/100,created:p.created}}
function sAddProject(oid,b){const price=sCts(b.sharePrice,1,1e6),goal=sCts(b.goal,100,1e8),total=Math.floor(goal/price);
  if(total<1||total>1e6||!CATS.includes(b.category)||String(b.title).trim().length<3||String(b.description).trim().length<10)throw sErr('bad_input');
  const p={id:sId(),oid,title:String(b.title).trim(),category:b.category,description:String(b.description).trim(),price,total,created:Date.now()};S.projects.push(p);return p}
function sBuy(u,pid,shares){const p=S.projects.find(x=>x.id===pid);if(!p)throw sErr('not_found');
  if(!Number.isInteger(shares)||shares<1)throw sErr('bad_input');
  if(shares>p.total-sSold(p))throw sErr('not_enough_shares');
  const cost=shares*p.price;if(sBal(u.id)<cost)throw sErr('no_funds');
  S.inv.push({id:sId(),pid,uid:u.id,shares,amount:cost,created:Date.now()});sTxAdd(u.id,'invest',-cost,pid);return sBal(u.id)/100}
function sPayout(owner,pid,amt,note){const p=S.projects.find(x=>x.id===pid&&x.oid===owner.id);if(!p)throw sErr('not_found');
  const m={};S.inv.filter(x=>x.pid===pid).forEach(x=>m[x.uid]=(m[x.uid]||0)+x.shares);
  const h=Object.entries(m).map(([uid,sh])=>({uid:+uid,sh})).sort((a,b)=>b.sh-a.sh);if(!h.length)throw sErr('no_investors');
  const sold=sSold(p);let given=0;h.forEach(x=>{x.c=Math.floor(amt*x.sh/sold);given+=x.c});h[0].c+=amt-given;
  S.payouts.push({id:sId(),pid,amount:amt,note,created:Date.now()});h.forEach(x=>x.c>0&&sTxAdd(x.uid,'income',x.c,pid,note));return h.length}
function sLoad(){
  try{const d=JSON.parse(localStorage.getItem(MK));if(d&&d.users){S=d;return}}catch(e){}
  S={n:100,session:null,users:[],projects:[],inv:[],payouts:[],tx:[]};
  const o={id:sId(),name:'صاحب مشروع تجريبي',email:'owner@demo.com',pass:'demo12345',role:'owner'};
  const i={id:sId(),name:'مستثمر تجريبي',email:'investor@demo.com',pass:'demo12345',role:'investor'};S.users.push(o,i);
  const a=sAddProject(o.id,{title:'مزرعة الوادي الأخضر للزيتون',category:'agri',goal:50000,sharePrice:100,description:'توسعة مزرعة الزيتون العائلية بمعصرة جديدة و٢٠٠٠ شجرة إضافية. يأتي الدخل من بيع زيت الزيتون الفاخر.'});
  const b=sAddProject(o.id,{title:'محمصة قهوة المدينة',category:'food',goal:30000,sharePrice:50,description:'محمصة قهوة تزوّد ٣٠ مقهى في الحي. تُستخدم الأموال لشراء آلة تحميص ثانية وخط تغليف.'});
  sAddProject(o.id,{title:'ألواح شمسية لمدرسة النور',category:'energy',goal:80000,sharePrice:200,description:'تركيب ألواح شمسية على السطح وبيع فائض الكهرباء للشبكة. يُوزَّع الدخل من مبيعات الطاقة الشهرية.'});
  sTxAdd(i.id,'deposit',2500000);sBuy(i,a.id,120);sBuy(i,b.id,80);sPayout(o,a.id,120000,'مبيعات الزيت للربع الثالث');sSave();
}
async function staticApi(method,url,body){
  body=body||{};if(!S)sLoad();const cur=S.users.find(u=>u.id===S.session)||null;let m;
  const need=role=>{if(!cur)throw sErr('unauth');if(role&&cur.role!==role)throw sErr('forbidden');return cur};
  const done=v=>{sSave();return v};
  if(url==='/api/signup'&&method==='POST'){
    const name=String(body.name||'').trim(),email=String(body.email||'').trim().toLowerCase(),pw=String(body.password||'');
    if(name.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)||pw.length<8||!['investor','owner'].includes(body.role))throw sErr('bad_input');
    if(S.users.some(u=>u.email===email))throw sErr('email_used');
    const u={id:sId(),name,email,pass:pw,role:body.role};S.users.push(u);S.session=u.id;return done({ok:true})}
  if(url==='/api/login'&&method==='POST'){
    const u=S.users.find(x=>x.email===String(body.email||'').trim().toLowerCase()&&x.pass===body.password);
    if(!u)throw sErr('bad_login');S.session=u.id;return done({ok:true})}
  if(url==='/api/logout'){S.session=null;return done({ok:true})}
  if(url==='/api/me')return{user:cur?{id:cur.id,name:cur.name,email:cur.email,role:cur.role,balance:cur.role==='investor'?sBal(cur.id)/100:undefined}:null};
  if(url==='/api/projects'&&method==='GET')return S.projects.slice().reverse().map(sProj);
  if(url==='/api/projects'&&method==='POST')return done({id:sAddProject(need('owner').id,body).id});
  if(m=url.match(/^\/api\/projects\/(\d+)$/)){const p=S.projects.find(x=>x.id===+m[1]);if(!p)throw sErr('not_found');return sProj(p)}
  if(m=url.match(/^\/api\/projects\/(\d+)\/buy$/))return done({balance:sBuy(need('investor'),+m[1],body.shares)});
  if(m=url.match(/^\/api\/projects\/(\d+)\/payout$/))return done({investors:sPayout(need('owner'),+m[1],sCts(body.amount,.01,1e7),String(body.note||'').slice(0,120))});
  if(url==='/api/wallet/deposit'){const u=need('investor');sTxAdd(u.id,'deposit',sCts(body.amount,.01,1e5));return done({balance:sBal(u.id)/100})}
  if(url==='/api/wallet/withdraw'){const u=need('investor'),c=sCts(body.amount,.01,1e7),d=String(body.destination||'').trim();
    if(d.length<4||d.length>100)throw sErr('bad_input');if(sBal(u.id)<c)throw sErr('no_funds');sTxAdd(u.id,'withdraw',-c,null,d);return done({balance:sBal(u.id)/100})}
  if(url==='/api/investor/dashboard'){const u=need('investor'),mine=S.inv.filter(x=>x.uid===u.id),ids=[...new Set(mine.map(x=>x.pid))];
    const inc=pid=>S.tx.filter(x=>x.uid===u.id&&x.type==='income'&&x.pid===pid).reduce((a,x)=>a+x.amount,0);
    const holdings=ids.map(pid=>{const p=S.projects.find(x=>x.id===pid),sh=mine.filter(x=>x.pid===pid).reduce((a,x)=>a+x.shares,0);
      return{id:pid,title:p.title,shares:sh,totalShares:p.total,invested:sh*p.price/100,income:inc(pid)/100}});
    return{balance:sBal(u.id)/100,holdings,totalIncome:S.tx.filter(x=>x.uid===u.id&&x.type==='income').reduce((a,x)=>a+x.amount,0)/100,
      history:S.tx.filter(x=>x.uid===u.id).slice().reverse().map(x=>({id:x.id,type:x.type,amount:x.amount/100,note:x.note,project:(S.projects.find(p=>p.id===x.pid)||{}).title||null,date:x.created}))}}
  if(url==='/api/owner/dashboard'){const u=need('owner');
    return S.projects.filter(p=>p.oid===u.id).reverse().map(p=>{const by={};S.inv.filter(x=>x.pid===p.id).forEach(x=>by[x.uid]=(by[x.uid]||0)+x.shares);
      return{...sProj(p),investors:Object.entries(by).map(([id,sh])=>({name:S.users.find(x=>x.id===+id).name,shares:sh,amount:sh*p.price/100})).sort((a,b)=>b.shares-a.shares),
        payouts:S.payouts.filter(x=>x.pid===p.id).reverse().map(x=>({amount:x.amount/100,note:x.note,date:x.created}))}})}
  throw sErr('not_found');
}

/* ---------- API ---------- */
async function api(method,url,body){
  if(STATIC)return staticApi(method,url,body);
  let r;
  try{r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}
  catch(e){const x=new Error('server');x.code='server';throw x}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const x=new Error(d.error||'server');x.code=d.error||'server';throw x}
  return d;
}
const errText=e=>{const k='e_'+(e.code||'server');return T[k]?t(k):t('e_server')};

/* ---------- router ---------- */
let renderTok=0;
async function render(){
  const tok=++renderTok;nav();const h=location.hash||'#/';let html;
  try{
    if(h.startsWith('#/project/'))html=await vProject(parseInt(h.split('/')[2])||0);
    else if(h==='#/login')html=me?(go('#/dashboard'),''):vAuth('login');
    else if(h==='#/signup')html=me?(go('#/dashboard'),''):vAuth('signup');
    else if(h==='#/dashboard')html=!me?(go('#/login'),''):me.role==='owner'?await vOwner():await vInvestor();
    else if(h==='#/new')html=me&&me.role==='owner'?vNew():(go('#/login'),'');
    else html=await vHome();
  }catch(e){html=`<div class="msg err">${esc(errText(e))}</div>`}
  if(tok!==renderTok)return;
  $('#app').innerHTML=html;flash='';
  if(!h.startsWith('#/new'))window.scrollTo(0,0);
}

  try{const r=await fetch('/api/me',{credentials:'same-origin'});STATIC=!(r.ok&&/json/.test(r.headers.get('content-type')||''))}catch(e){STATIC=true}
  if(STATIC)document.querySelector('header').insertAdjacentHTML('afterend',`<div class="msg" style="margin:0;border-radius:0;text-align:center;font-size:.85rem;background:#fffbeb;color:#92400e">${t('staticNote')}</div>`);

}
